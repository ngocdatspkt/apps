<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thu Chi cá nhân</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thu Chi">
<meta name="theme-color" content="#F5F7FA">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#F5F7FA;overflow:hidden}
#f{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;display:block}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font:15px -apple-system,"Segoe UI",sans-serif;color:#6b7280;text-align:center;padding:24px}
#msg button{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:10px;background:#1F4E78;color:#fff}
</style>
</head>
<body>
<div id="msg">Đang tải Thu Chi cá nhân…</div>
<iframe id="f" title="Thu Chi cá nhân" allow="clipboard-write"></iframe>
<script>
// link web app được mã hoá nhẹ để các bot quét GitHub không đọc được trực tiếp
var K = "jVGel9SQLFVcyNlSLFzcmhzM2YDbQxGe2YFbxgTazMTb1sGUZVDV492V2FmQMZlQrJFUUJkV0NHUnRkT5dGcy1mMs1EbRhUQ3J2Y5Z2SB9ycvM3byNWYt9SbvNmLlx2Zv92ZuQHcpJ3Yz9yL6MHc0RHa";
var u = atob(K.split("").reverse().join(""));
var f = document.getElementById("f"), m = document.getElementById("msg");
function load() { m.innerHTML = "Đang tải Thu Chi cá nhân…"; f.src = u; }
f.addEventListener("load", function () { m.style.display = "none"; });
window.addEventListener("online", load);
if (!navigator.onLine) m.innerHTML = 'Không có Internet.<br>Ứng dụng sẽ tự tải lại khi có mạng.<button onclick="load()">Thử lại</button>';
else load();
// mở lại app sau thời gian dài: tải lại để phiên Google không bị hết hạn
var hid = 0;
document.addEventListener("visibilitychange", function () {
  if (document.hidden) hid = Date.now();
  else if (hid && Date.now() - hid > 6 * 3600 * 1000) load();
});
</script>
</body>
</html>
